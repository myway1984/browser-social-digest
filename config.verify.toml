[app]
timezone = "Asia/Shanghai"
database_path = "verify_data_2/social_digest.db"
poll_interval_minutes = 30

[digest]
send_every_minutes = 720
lookback_hours = 24
max_items_per_source = 8
title = "社交媒体追踪简报"

[delivery]
output_dir = "verify_output_2"
write_markdown = true
print_to_console = false

[[sources]]
name = "X Monitor Pool"
platform = "x"
enabled = false
usernames = ["OpenAI"]
accounts_file = "sources/x_accounts.csv"
default_category = "ai-tech"
window_hours = 24
fetch_overlap_minutes = 2
max_results = 20
max_pages = 2
exclude_replies = true
exclude_reposts = true
strategy = "api_then_browser"
bearer_token_env = "X_BEARER_TOKEN"
remote_debug_profile_dir = "secrets/x_chrome_profile"
remote_debug_port = 9222

[[sources]]
name = "调试样例"
platform = "mock"
enabled = true
max_results = 3
