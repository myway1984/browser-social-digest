[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "social-digest-agent"
version = "0.1.0"
description = "Scheduled social content collector and digest generator for X, Weibo, and WeChat."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<0.29",
]

[project.optional-dependencies]
browser = [
  "playwright>=1.52,<2",
]

[project.scripts]
social-digest = "social_digest.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
